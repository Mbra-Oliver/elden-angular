<div class="stick-zone" (pointerdown)="stickDown($event)" (pointermove)="stickMove($event)"
  (pointerup)="stickUp($event)" (pointercancel)="stickUp($event)" aria-hidden="true">
  @if (stick(); as s) {
    <div class="stick-base" [style.left.px]="s.x" [style.top.px]="s.y">
      <div class="stick-knob" [style.transform]="'translate(' + s.dx + 'px,' + s.dy + 'px)'"></div>
    </div>
  } @else {
    <div class="stick-ghost"></div>
  }
</div>

<!-- Hors combat : frappe et esquive seulement. En combat : lourde, mixture et verrou s'ajoutent. -->
<div class="arc" [class.combat]="combat()" [style.--touch-scale]="uiScale()" role="group" aria-label="Actions">
  @for (pad of slots(); track pad.index) {
    @if (combat() || !pad.combatOnly) {
      <button type="button" [class]="'pad slot' + (pad.index + 1) + ' action-' + pad.action" [class.held]="held().has(pad.index)"
        [attr.aria-label]="pad.label"
        (pointerdown)="padDown(pad.index, $event)" (pointerup)="padUp(pad.index)"
        (pointercancel)="padUp(pad.index)" (lostpointercapture)="padUp(pad.index)"
        (contextmenu)="$event.preventDefault()">
        <span aria-hidden="true">{{ pad.glyph }}</span>
      </button>
    }
  }
  @if (combat()) {
    <button type="button" class="pad lock" aria-label="Verrouiller la cible (glisser sur l’image pour en changer)"
      (pointerdown)="lock($event)" (contextmenu)="$event.preventDefault()"><span aria-hidden="true">⌖</span></button>
  }
</div>

@if (prompt(); as p) {
  <button type="button" class="prompt" [class.combat]="combat()" (pointerdown)="interact($event)" (contextmenu)="$event.preventDefault()">
    <span class="glyph" aria-hidden="true">◈</span> {{ p.label }}
  </button>
}

<button type="button" class="pause" aria-label="Pause" (click)="pause.emit()">
  <!-- Trois traits, comme les bandes d'un tissu adinkra. -->
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" /></svg>
</button>
