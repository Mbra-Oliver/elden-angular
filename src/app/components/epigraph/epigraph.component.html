@if (visible()) {
  <div class="epigraph" role="button" tabindex="0" aria-label="Passer l'épigraphe">
    <div class="lines">
      <p>« 1701. Pendant des générations, les royaumes de la forêt ont courbé l'échine sous le tribut du Denkyira. »</p>
      <p>« Ce soir, à Feyiase, le sang va payer le prix de la liberté. »</p>
    </div>
    <small>Touche ou clic pour entrer</small>
  </div>
}
