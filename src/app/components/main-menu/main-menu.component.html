<main class="title-screen" (keydown.escape)="controlsOpen.set(false)">
  <img class="cover-image" src="assets/passage-de-l-ouest.jpg" alt="" fetchpriority="high">
  <div class="backdrop" aria-hidden="true"></div>
  <div class="title-content">
    <h1>Les Sentiers<br><span>de Terre Rouge</span></h1>
    <nav aria-label="Menu principal">
      <button type="button" class="primary" (click)="start()">Nouvelle partie</button>
      <button type="button" (click)="controlsOpen.set(!controlsOpen())" [attr.aria-expanded]="controlsOpen()">
        Commandes
      </button>
    </nav>
    @if (controlsOpen()) {
      <section class="bindings" aria-label="Commandes du jeu">
        <dl>
          <dt>Déplacement</dt><dd>Flèches ou ZQSD</dd>
          <dt>Combo</dt><dd>Espace</dd>
          <dt>Attaque lourde</dt><dd>E</dd>
          <dt>Esquive</dt><dd>Maj</dd>
          <dt>Interaction</dt><dd>F</dd>
          <dt>Choix de dialogue</dt><dd>1 ou 2</dd>
        </dl>
      </section>
    }
  </div>
</main>
