<app-epigraph />

@switch (gameState.currentScreen()) {
  @case ("main-menu") {
    <app-main-menu />
  }

  @case ("playing") {
    <app-game-canva />
  }
  @case ("victory") {
    <app-death-menu />
  }

  @case ("duel") {
    <app-duel-arena />
  }

  @case ("death") {
    <app-death-menu />
  }
}

<!-- Téléphone tenu en portrait : le jeu se joue en paysage. -->
<div class="rotate" role="alert" aria-live="assertive">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <rect class="phone" x="22" y="10" width="20" height="36" rx="3" />
    <path class="arrow" d="M48 40a18 18 0 0 1-14 12m0 0 4-4m-4 4 5 2" />
  </svg>
  <p>Tourne ton téléphone</p>
  <small>Les Sentiers de Terre Rouge se jouent en paysage.</small>
</div>
